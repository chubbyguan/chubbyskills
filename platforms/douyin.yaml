id: douyin
name: Douyin
skill: douyin-transcribe
script: scripts/transcribe.py
category: video
status: heavy
source_types: [video]
required_deps: [cmd:ffmpeg, python:funasr]
optional_deps: []
output_contract: markdown_schema_v1
fallback: audio transcription
failure_modes: [expired_short_link, anti_bot, ffmpeg_or_funasr_missing, download_blocked, spider_shell_requires_cookies]
fallback_command: save video locally, then run python3 douyin-transcribe/scripts/transcribe.py "<local-video>" output
sample_source: https://v.douyin.com/example/
notes: Platform risk is mainly link expiry and anti-bot behavior. Cookie-less share pages now return a spider shell; the downloader then falls back to yt-dlp with YTDLP_COOKIES_FROM_BROWSER (fresh douyin.com visit suffices, no login needed).
