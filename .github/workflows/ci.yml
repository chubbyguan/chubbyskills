name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  reliability:
    name: Reliability checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test and MCP dependencies
        run: python -m pip install -r requirements-dev.txt -r knowledge-base-management/requirements-mcp.txt

      - name: Editable install exposes the chubby CLI
        run: |
          python -m pip install -e .
          chubby --version
          chubby --help

      - name: Python syntax check
        run: |
          find . -name "*.py" -type f -not -path "./.git/*" -not -path "./.venv/*" -print0 \
            | xargs -0 python -m py_compile

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: MCP stdio handshake and tool calls
        run: python tools/mcp_smoke.py --json

      - name: Validate example outputs
        run: |
          python tools/validate_outputs.py examples/outputs
          python tools/validate_outputs.py examples/outputs --schema-v1
          python tools/golden_outputs.py examples/outputs
          python tools/platform_health.py --check
          python tools/platform_health.py --check-output
          python tools/platform_smoke.py --mode all --check
          tmp_adapter="$(mktemp -d)"
          python tools/platform_adapter.py new demo-news --name "Demo News" --sample-source "https://demo.example/news/1" --match demo.example --repo-root "$tmp_adapter"
          python tools/platform_health.py --platform-dir "$tmp_adapter/platforms" --template-dir "$tmp_adapter/templates/sites" --repo-root "$tmp_adapter" --check
          rm -rf "$tmp_adapter"
          python tools/vault_index.py --db /tmp/chubby-vault-index.sqlite index examples/outputs
          python tools/vault_index.py --db /tmp/chubby-vault-index.sqlite search 样例 --limit 2
          python tools/vault_index.py --db /tmp/chubby-vault-index.sqlite semantic 内容策略 --limit 2
          python tools/vault_index.py --db /tmp/chubby-vault-index.sqlite stats
          rm -f /tmp/chubby-vault-index.sqlite

      - name: CLI smoke tests
        run: |
          python tools/check_env.py
          python tools/chubby.py --help
          python tools/chubby.py ingest --help
          python tools/chubby.py run --help
          python tools/chubby.py status --help
          python tools/chubby.py retry --help
          python tools/chubby.py search --help
          python tools/chubby.py brief --help
          python tools/chubby.py import --help
          python tools/chubby.py doctor --platform x
          python tools/chubby.py doctor --platform document
          python tools/import_document.py --help
          python podcast-transcribe/scripts/transcribe.py --help
          python podcast-transcribe/scripts/batch_transcribe.py --help
          python tools/evidence_brief.py --help
          python tools/chubby.py quickstart --ephemeral --no-state
          python tools/chubby_ingest.py --help
          python tools/platform_health.py --help
          python tools/platform_adapter.py --help
          python tools/vault_curator.py --help
          python tools/vault_index.py --help
          python tools/validate_outputs.py --help
          python tools/golden_outputs.py --help
          python tools/platform_smoke.py --help
          python tools/mcp_workflow_demo.py --help
          python industry-intelligence-radar/scripts/scan.py --help
          python knowledge-base-management/scripts/vault_health_check.py --help
          python tiktok-transcribe/scripts/transcribe.py --help
          python weibo-transcribe/scripts/transcribe.py --help
          python zhihu-transcribe/scripts/transcribe.py --help
          python bilibili-transcribe/scripts/transcribe.py --help
          python youtube-transcribe/scripts/transcribe.py --help
          python douyin-transcribe/scripts/transcribe.py 2>&1 | grep -q "Usage"
          python douyin-transcribe/scripts/download_douyin_audio.py 2>&1 | grep -q "Usage"

      - name: Lint
        run: |
          ruff check . --select E,F,W --ignore E402,E501

  installed-cli:
    # A checkout and a `pip install .` share code but not layout: user state must
    # never land in site-packages, and the version must not silently become 0.0.0.
    # Both regressions shipped unnoticed until this job existed.
    name: Non-editable install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install as a package (not editable)
        run: python -m pip install .

      - name: Run the knowledge-base CLI from outside the checkout
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          site_packages="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"

          version="$(chubby --version)"
          echo "$version"
          test "$version" != "chubbyskills 0.0.0"

          printf '# Installed run\n\nAn installed copy must not write user state into site-packages.\n' > notes.md
          chubby init --vault "$workdir/vault"
          chubby import notes.md --no-enrich
          chubby search "installed"
          chubby brief --topic "installed" --output "$workdir/brief.md"
          # `x` reads platforms/x.yaml and needs no external command; the
          # youtube path would fail here because the runner has no yt-dlp.
          chubby doctor --platform x

          for stray in chubby.yaml inbox runs output .chubby; do
            if [ -e "$site_packages/$stray" ]; then
              echo "::error::$stray was written into site-packages"
              exit 1
            fi
          done
          test -f "$workdir/chubby.yaml"
          test -f "$workdir/brief.md"
          test -f "$workdir/vault/00_Inbox"/*.md

      - name: Platform capture refuses a partial install with a clear hint
        run: |
          cd "$(mktemp -d)"
          # The run report and the failure line both go to stdout, so capture both.
          if chubby ingest "https://www.youtube.com/watch?v=aircAruvnKk" >capture.log 2>&1; then
            echo "::error::ingest must fail when the skill directories are absent"
            exit 1
          fi
          grep -q "git clone" capture.log
